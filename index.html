<svg xmlns="http://www.w3.org/2000/svg" width="805" height="600" viewBox="0 0 805 600" font-family="Arial, sans-serif">
  <style>
    .grid  { fill: none; stroke: lightgray; }
    .axis  { stroke: black; }
    .label { font-size: 12px; text-anchor: middle; dominant-baseline: central; }
    .area  { fill-opacity: 0.5; }
    .tick text { font-family: sans-serif; font-size: 10px; text-anchor: end; dominant-baseline: central; fill: currentColor; }
    .tick line { stroke: currentColor; }
  </style>

  <rect width="805" height="600" fill="#fff" />

  <g transform="translate(305 315)">
